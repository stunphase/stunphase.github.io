<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Sorta">
<meta name="theme-color" content="#2b2b2b">
<title>Sorta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<!--
  Sorta: a task list that orders itself by binary insertion sort.

  Adding a task asks "which comes first?" against the middle of the
  remaining range, so a list of n tasks needs about log2(n) answers.

  Behaviour decisions not covered by the original mockups:
  - SKIP FOR NOW swaps the top task with the next one.
  - RE-SORT pulls the top task out and asks the comparisons again;
    cancelling puts it back where it was.
  - VIEW ALL TASKS is read-only for order (no drag-to-reorder), so the
    comparisons stay the only way to rank. Tapping a task opens it in the
    task view, where the same actions apply to it. Tasks can be deleted there.
  - The task view also lists every task below its actions, current one
    highlighted; tapping one switches to it.
  - Each new list takes the next colour in a fixed hue step and keeps it,
    so lists build a rainbow down the home screen without repeating.
-->
<style>
  :root {
    --chrome: #2f2f2f;
    --chrome-text: rgba(255,255,255,.32);
    --home: #3d3d3d;
    --home-title: #4a4a4a;
    --ink: rgba(0,0,0,.34);
    --ink-strong: rgba(0,0,0,.46);
    --shade: rgba(0,0,0,.16);
    --rule: rgba(0,0,0,.14);
    --font: "Bebas Neue", "Oswald", "Arial Narrow", Impact, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* padding reset: hosts that wrap the page may add their own safe-area
     padding, which would double up with the bar's */
  html, body { margin: 0; padding: 0 !important; height: 100%; background: #1e1e1e; overflow: hidden; }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
  button:disabled { cursor: default; opacity: .45; }
  button:focus-visible, input:focus-visible { outline: 2px solid rgba(255,255,255,.5); outline-offset: -2px; }

  #app {
    position: relative; height: 100%; max-width: 430px; margin: 0 auto;
    background: var(--home); overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,.5);
  }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
  .screen.enter { animation: enter .22s ease-out; }
  .screen.enter-back { animation: enter-back .22s ease-out; }
  @keyframes enter { from { transform: translateX(28px); opacity: 0; } }
  @keyframes enter-back { from { transform: translateX(-28px); opacity: 0; } }

  /* Top bar: small grey links, as in the mockups */
  .bar {
    flex: none; display: flex; justify-content: space-between; align-items: flex-end;
    background: var(--chrome); color: var(--chrome-text);
    padding: env(safe-area-inset-top) 0 0;
    font-size: 24px; letter-spacing: .02em;
  }
  /* 44px minimum tap targets (Apple HIG) */
  .bar button { display: flex; align-items: center; min-height: 44px; min-width: 44px; padding: 3px 12px 0; }
  .bar button:hover { color: rgba(255,255,255,.55); }
  .bar .left { display: flex; align-items: stretch; }
  .bar .home-btn { justify-content: center; padding: 0 6px 0 10px; }
  .home-btn svg { width: 28px; height: 28px; }
  .home-btn path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .home-btn text { fill: currentColor; font-family: var(--font); font-size: 14px; }

  .title {
    flex: none; padding: 6px 8px 0; font-size: 46px; line-height: 1;
    color: var(--ink); box-shadow: inset 0 -2px 0 var(--rule);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .home .title { background: var(--home-title); color: rgba(255,255,255,.2); font-size: 52px; }

  /* Home: colour bands */
  .lists { flex: none; overflow-y: auto; }
  .row {
    display: block; width: 100%; height: 46px; padding: 8px 10px 0;
    font-size: 31px; line-height: 1; color: var(--ink);
    box-shadow: inset 0 -3px 4px -2px rgba(0,0,0,.22);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .count { float: right; font-size: 22px; padding-top: 5px; color: var(--rule); }
  .fill {
    flex: 1; display: flex; align-items: center; width: 100%;
    padding: 0 10px; font-size: 40px; color: var(--ink);
  }
  .fill.empty { color: rgba(255,255,255,.16); font-size: 44px; }
  .fill.top { align-items: flex-start; padding-top: 14px; font-size: 30px; }

  /* List screen */
  .band { background: var(--shade); }
  .current { flex: none; padding: 18px 10px 26px; }
  .big { font-size: 50px; line-height: .95; color: var(--ink-strong); word-wrap: break-word; }
  .add-task { flex: none; display: block; width: 100%; padding: 40px 10px 52px; font-size: 46px; color: rgba(255,255,255,.22); }
  .add-task:hover { color: rgba(255,255,255,.34); }
  .actions { flex: none; }
  .action {
    display: flex; justify-content: space-between; align-items: baseline;
    width: 100%; padding: 13px 10px 6px; font-size: 34px; line-height: 1;
    color: var(--ink); border-bottom: 1px solid var(--rule);
  }
  .action:not(:disabled):active, .row:active, .item:active { background: rgba(0,0,0,.08); }
  .action small { font-size: 20px; color: var(--rule); }
  .hint { padding: 12px 10px; font-size: 20px; color: var(--rule); }

  /* Text entry */
  .entry {
    flex: 1; display: flex; flex-direction: column; padding: 18px 10px;
  }
  .entry textarea {
    width: 100%; flex: none; height: 3.1em; resize: none;
    background: transparent; border: 0; outline: 0;
    font: inherit; font-size: 50px; line-height: .98; color: var(--ink-strong);
    text-transform: uppercase; caret-color: rgba(255,255,255,.7);
  }
  .entry textarea::placeholder { color: rgba(0,0,0,.18); }
  .dark .entry textarea { color: rgba(255,255,255,.55); }
  .dark .entry textarea::placeholder { color: rgba(255,255,255,.14); }
  .entry .go {
    align-self: flex-start; margin-top: 18px; padding: 10px 16px 4px;
    background: var(--shade); font-size: 30px; color: var(--ink);
  }
  .dark .entry .go { color: rgba(255,255,255,.4); background: rgba(255,255,255,.06); }

  /* Compare: "which comes first?" */
  .compare { flex: 1; display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; }
  .pick { flex: 1; display: flex; flex-direction: column; width: 100%; padding: 22px 10px; transition: background .12s; }
  .pick:active, .pick.chosen { background: rgba(255,255,255,.1); }
  .pick.mine { justify-content: space-between; }
  .pick.theirs { justify-content: space-between; align-items: flex-end; text-align: right; }
  .pick .big { font-size: 48px; }
  .arrow { width: 54px; height: 44px; fill: rgba(0,0,0,.22); margin: 0 0 0 44px; }
  .theirs .arrow { margin: 0 44px 0 0; }
  .question {
    flex: none; background: var(--shade); text-align: center;
    padding: 9px 6px 3px; font-size: 38px; line-height: 1; color: var(--ink);
  }
  .question small { display: block; font-size: 18px; padding-top: 3px; color: rgba(0,0,0,.26); }

  /* All tasks */
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .item {
    display: flex; align-items: baseline; gap: 10px; width: 100%;
    padding: 12px 10px 6px; font-size: 30px; line-height: 1; color: var(--ink);
    border-bottom: 1px solid var(--rule);
  }
  .item .open { flex: 1; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .item .n { flex: none; width: 1.3em; color: var(--rule); }
  .place { font-size: 20px; color: var(--rule); padding-bottom: 6px; }
  .item .t { flex: 1; word-wrap: break-word; min-width: 0; }
  .item .x { flex: none; font-size: 24px; color: var(--rule); padding: 0 4px; }
  .item.first { background: var(--shade); color: var(--ink-strong); }
  .item .open { min-height: 30px; }
  .item.done .t { text-decoration: line-through; opacity: .55; }
  .section { padding: 22px 10px 4px; font-size: 22px; color: var(--rule); border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; }
  .danger { color: rgba(0,0,0,.4); }

  /* Settings / about */
  .dark { background: var(--home); }
  .dark .title { background: var(--home-title); color: rgba(255,255,255,.2); }
  .dark .action { color: rgba(255,255,255,.3); border-color: rgba(255,255,255,.07); }
  .about {
    padding: 18px 10px 30px; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: rgba(255,255,255,.4);
  }
  .about b { color: rgba(255,255,255,.6); font-weight: 600; }

  /* Undo toast */
  .toast {
    position: absolute; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 10px);
    display: flex; justify-content: space-between; align-items: center;
    background: #262626; color: rgba(255,255,255,.55);
    padding: 10px 12px 6px; font-size: 24px; box-shadow: 0 6px 20px rgba(0,0,0,.35);
    animation: up .2s ease-out; z-index: 5;
  }
  .toast button { color: rgba(255,255,255,.85); padding-left: 16px; }
  @keyframes up { from { transform: translateY(20px); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .screen.enter, .screen.enter-back, .toast { animation: none; }
  }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var KEY = 'sorta.v1';
  var app = document.getElementById('app');

  // ---------- data ----------

  function uid() { return Math.random().toString(36).slice(2, 10); }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); if (d && Array.isArray(d.lists)) return d; }
    } catch (e) {}
    return { lists: [] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

  var data = load();
  // Lists saved before colours were stored get theirs in list order.
  if (typeof data.nextColor !== 'number') data.nextColor = 0;
  data.lists.forEach(function (l) { if (typeof l.hue !== 'number') l.hue = hueFor(data.nextColor++); });
  var ui = { view: 'home', listId: null, cmp: null, focus: null };
  var toastTimer = null;

  function list() {
    for (var i = 0; i < data.lists.length; i++) if (data.lists[i].id === ui.listId) return data.lists[i];
    return null;
  }

  // Each new list takes the next hue in a fixed 22-degree step and keeps
  // it, so lists run red, orange, yellow, green, teal, blue, purple, pink
  // and round again. Each later lap is offset by half a step so its
  // colours fall between the previous lap's instead of repeating them.
  function hueFor(n) {
    var step = 22, raw = n * step, lap = Math.floor(raw / 360);
    return (2 + raw + lap * step / 2) % 360;
  }
  function color(h) {
    var l = 50;
    if (h < 35) l = 52;                              // reds and oranges
    else if (h < 75) l = 48;                         // yellows read bright, pull them down
    else if (h < 180) l = 52 - (h - 75) * 0.11;      // greens darken toward teal
    else if (h < 270) l = 54;                        // blues read dark, lift them
    return 'hsl(' + Math.round(h) + ',54%,' + Math.round(l) + '%)';
  }
  function listColor(l) { return color(l.hue); }
  function newList(name, tasks) {
    var l = { id: uid(), name: name, hue: hueFor(data.nextColor++), done: [],
              tasks: (tasks || []).map(function (t) { return { id: uid(), text: t }; }) };
    data.lists.push(l);
    return l;
  }

  // Index of the task shown in the task view; the top task unless one was
  // picked from VIEW ALL TASKS.
  function focusIndex(l) {
    for (var i = 0; i < l.tasks.length; i++) if (l.tasks[i].id === ui.focus) return i;
    ui.focus = null;
    return 0;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------- binary insertion ----------
  // The task is compared with the middle of [lo, hi). "New comes first"
  // narrows to the upper half, otherwise the lower half. When the range is
  // empty, lo is the insertion point.

  function startInsert(l, task, origIndex, returnView) {
    if (l.tasks.length === 0) { l.tasks.push(task); save(); go(returnView || 'list'); return; }
    var n = l.tasks.length;
    ui.cmp = {
      listId: l.id, task: task, lo: 0, hi: n, asked: 0,
      estimate: Math.ceil(Math.log2(n + 1)),
      origIndex: origIndex, returnView: returnView || 'list'
    };
    go('compare');
  }

  function answer(newFirst) {
    var c = ui.cmp, l = list();
    var mid = (c.lo + c.hi) >> 1;
    if (newFirst) c.hi = mid; else c.lo = mid + 1;
    c.asked++;
    if (c.lo >= c.hi) {
      l.tasks.splice(c.lo, 0, c.task);
      save();
      ui.cmp = null;
      go(c.returnView, 'back');
    } else {
      render('enter');
    }
  }

  function cancelCompare() {
    var c = ui.cmp, l = list();
    if (c && c.origIndex != null) {           // re-sort: put it back
      l.tasks.splice(c.origIndex, 0, c.task);
      save();
    }
    ui.cmp = null;
    go('list', 'back');
  }

  // ---------- navigation ----------

  function go(view, dir) {
    ui.view = view;
    render(dir === 'back' ? 'enter-back' : dir === 'none' ? null : 'enter');
  }

  function toast(msg, undo) {
    clearTimeout(toastTimer);
    var old = app.querySelector('.toast'); if (old) old.remove();
    var t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button">UNDO</button>' : '');
    if (undo) t.querySelector('button').onclick = function () { t.remove(); undo(); save(); render(); };
    app.appendChild(t);
    toastTimer = setTimeout(function () { t.remove(); }, 4000);
  }

  // ---------- views ----------

  var views = {
    home: function () {
      var n = data.lists.length;
      var rows = data.lists.map(function (l, i) {
        var c = l.tasks.length ? '<span class="count">' + l.tasks.length + '</span>' : '';
        return '<button class="row" style="background:' + listColor(l) + '" data-a="open" data-id="' + l.id + '">' +
               c + esc(l.name) + '</button>';
      }).join('');
      var fill = n
        ? '<button class="fill top" style="background:' + color(hueFor(data.nextColor)) + '" data-a="addList">+ ADD A LIST</button>'
        : '<button class="fill empty" data-a="addList">+ ADD A LIST</button>';
      return '<div class="screen home">' +
        bar(['SETTINGS', 'settings'], ['ADD', 'addList']) +
        '<div class="title">SORTA</div>' +
        '<div class="lists">' + rows + '</div>' + fill + '</div>';
    },

    addList: function () {
      return '<div class="screen dark">' +
        bar(['BACK', 'home'], ['CANCEL', 'home']) +
        '<div class="title">NEW LIST</div>' +
        entry('LIST NAME', 'createList', 'CREATE') + '</div>';
    },

    list: function () {
      var l = list(); if (!l) { ui.view = 'home'; return views.home(); }
      var body;
      if (!l.tasks.length) {
        body = '<button class="add-task band" data-a="addTask">+ ADD A TASK</button>' +
               (l.done.length ? '<div class="hint">' + l.done.length + ' DONE. NICE.</div>' : '');
      } else {
        var i = focusIndex(l), n = l.tasks.length;
        body = '<div class="current band">' +
          (i > 0 ? '<div class="place">#' + (i + 1) + ' OF ' + n + '</div>' : '') +
          '<div class="big">' + esc(l.tasks[i].text) + '</div></div>' +
          '<div class="actions">' +
          action('MARK AS DONE', 'done') +
          action('SKIP FOR NOW', 'skip', i >= n - 1) +
          action('RE-SORT', 'resort', n < 2) +
          action('VIEW ALL TASKS', 'all', false, l.tasks.length) +
          '</div>' +
          (n > 1 ? '<div class="section"><span>THE LIST</span></div>' + taskRows(l, i, false) : '');
      }
      return '<div class="screen" style="background:' + listColor(l) + '">' +
        bar(ui.focus && ui.focusFrom === 'all' ? ['BACK', 'all'] : ['BACK', 'home'], ['ADD', 'addTask']) +
        '<div class="title">' + esc(l.name) + '</div><div class="scroll">' + body + '</div></div>';
    },

    addTask: function () {
      var l = list();
      return '<div class="screen" style="background:' + listColor(l) + '">' +
        bar(['BACK', 'list'], ['CANCEL', 'list']) +
        '<div class="title">' + esc(l.name) + '</div>' +
        entry('NEW TASK', 'createTask', l.tasks.length ? 'SORT IT' : 'ADD') + '</div>';
    },

    compare: function () {
      var l = list(), c = ui.cmp;
      var other = l.tasks[(c.lo + c.hi) >> 1];
      var left = Math.max(1, c.estimate - c.asked);
      return '<div class="screen" style="background:' + listColor(l) + '">' +
        bar(['', ''], ['CANCEL', 'cancelCompare']) +
        '<div class="compare" id="compare">' +
          '<button class="pick mine" data-a="pickNew" aria-label="' + esc(c.task.text) + ' comes first">' +
            '<span class="big">' + esc(c.task.text) + '</span>' + arrow(true) + '</button>' +
          '<div class="question">WHICH COMES FIRST?<small>' +
            (left === 1 ? 'ABOUT 1 MORE' : 'ABOUT ' + left + ' MORE') + '</small></div>' +
          '<button class="pick theirs" data-a="pickOld" aria-label="' + esc(other.text) + ' comes first">' +
            arrow(false) + '<span class="big">' + esc(other.text) + '</span></button>' +
        '</div></div>';
    },

    all: function () {
      var l = list();
      var items = taskRows(l, 0, true);
      if (!l.tasks.length) items = '<div class="hint">NOTHING TO DO.</div>';
      var done = '';
      if (l.done.length) {
        done = '<div class="section"><span>DONE</span><button data-a="clearDone">CLEAR</button></div>' +
          l.done.slice().reverse().map(function (t) {
            return '<div class="item done"><span class="n">&#10003;</span><span class="t">' + esc(t.text) + '</span>' +
              '<button class="x" data-a="restore" data-id="' + t.id + '" aria-label="Restore">&#8634;</button></div>';
          }).join('');
      }
      return '<div class="screen" style="background:' + listColor(l) + '">' +
        bar(['BACK', 'list'], ['ADD', 'addTask']) +
        '<div class="title">' + esc(l.name) + '</div>' +
        '<div class="scroll">' + items + done +
          '<div class="section"></div>' + action('DELETE LIST', 'delList') + '</div></div>';
    },

    settings: function () {
      return '<div class="screen dark">' +
        bar(['BACK', 'home'], ['', '']) +
        '<div class="title">SETTINGS</div>' +
        '<div class="scroll">' +
          action('LOAD SAMPLE LISTS', 'sample') +
          action('ERASE EVERYTHING', 'erase') +
          '<div class="about"><b>How Sorta works.</b> You never rank your list. When you add a task, ' +
          'Sorta asks you to compare it with one task at a time, starting in the middle and halving ' +
          'the range each time (binary insertion sort). A list of 30 tasks takes about 5 taps.<br><br>' +
          '<b>Skip for now</b> swaps the top task with the next one. <b>Re-sort</b> asks the ' +
          'comparisons again for the top task, for when priorities have changed.<br><br>' +
          'Your lists are stored on this device only.</div>' +
        '</div></div>';
    }
  };

  // The ordered task list; row `hi` is highlighted, and each row opens
  // that task in the task view.
  function taskRows(l, hi, deletable) {
    return l.tasks.map(function (t, i) {
      return '<div class="item' + (i === hi ? ' first' : '') + '">' +
        '<button class="open" data-a="focus" data-id="' + t.id + '"><span class="n">' + (i + 1) + '</span>' +
        '<span class="t">' + esc(t.text) + '</span></button>' +
        (deletable ? '<button class="x" data-a="delTask" data-id="' + t.id + '" aria-label="Delete">&times;</button>' : '') +
        '</div>';
    }).join('');
  }

  function bar(left, right) {
    function b(x) { return x[0] ? '<button data-a="' + x[1] + '">' + x[0] + '</button>' : '<span></span>'; }
    var home = ui.view === 'home' ? '' :
      '<button class="home-btn" data-a="home" aria-label="Home">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 L12 3 L21 11 V21 H3 Z"/>' +
        '<text x="12" y="19.8" text-anchor="middle">S</text></svg></button>';
    return '<div class="bar"><div class="left">' + home + b(left) + '</div>' + b(right) + '</div>';
  }
  function action(label, a, disabled, count) {
    return '<button class="action" data-a="' + a + '"' + (disabled ? ' disabled' : '') + '><span>' + label + '</span>' +
      (count != null ? '<small>' + count + '</small>' : '') + '</button>';
  }
  function entry(placeholder, a, label) {
    return '<form class="entry" data-submit="' + a + '">' +
      '<textarea name="t" rows="3" maxlength="120" placeholder="' + placeholder + '" autocomplete="off" ' +
      'autocapitalize="characters" enterkeyhint="done"></textarea>' +
      '<button class="go" type="submit">' + label + '</button></form>';
  }
  function arrow(up) {
    var p = up ? 'M27 0 L54 22 L39 22 L39 44 L15 44 L15 22 L0 22 Z' : 'M15 0 L39 0 L39 22 L54 22 L27 44 L0 22 L15 22 Z';
    return '<svg class="arrow" viewBox="0 0 54 44" aria-hidden="true"><path d="' + p + '"/></svg>';
  }

  function render(anim) {
    app.innerHTML = views[ui.view]();
    var s = app.firstChild;
    if (anim) s.classList.add(anim);
    var ta = app.querySelector('textarea');
    if (ta) setTimeout(function () { ta.focus(); }, 30);
    if (ui.view === 'compare') bindSwipe();
  }

  // ---------- actions ----------

  var actions = {
    home: function () {
      var c = ui.cmp;
      if (c && c.origIndex != null) { list().tasks.splice(c.origIndex, 0, c.task); save(); }  // abandon a re-sort
      ui.cmp = null; ui.focus = null; go('home', 'back');
    },
    settings: function () { go('settings'); },
    addList: function () { go('addList'); },
    open: function (el) { ui.listId = el.dataset.id; ui.focus = null; go('list'); },
    list: function () { go('list', 'back'); },
    addTask: function () { go('addTask'); },
    all: function () { var back = ui.view === 'list' && ui.focus; ui.focus = null; go('all', back ? 'back' : null); },
    focus: function (el) {
      if (ui.view === 'all') ui.focusFrom = 'all';
      else if (!ui.focus) ui.focusFrom = 'list';
      ui.focus = el.dataset.id;
      go('list', ui.focusFrom === 'all' ? null : 'none');
    },
    cancelCompare: cancelCompare,
    pickNew: function () { answer(true); },
    pickOld: function () { answer(false); },

    // These act on the task shown in the task view: the top one, or the
    // one picked from VIEW ALL TASKS.
    done: function () {
      var l = list(), i = focusIndex(l), t = l.tasks.splice(i, 1)[0];
      l.done.push(t); ui.focus = null; save(); render();
      toast('DONE: ' + t.text.toUpperCase(), function () { l.done.pop(); l.tasks.splice(i, 0, t); });
    },
    skip: function () {
      var l = list(), i = focusIndex(l), t = l.tasks.splice(i, 1)[0];
      l.tasks.splice(i + 1, 0, t);
      ui.focus = i > 0 ? l.tasks[i].id : null;
      save(); render('enter');
    },
    resort: function () {
      var l = list(), i = focusIndex(l), t = l.tasks.splice(i, 1)[0];
      ui.focus = null;
      startInsert(l, t, i, 'list');
    },
    delTask: function (el) {
      var l = list(), i = l.tasks.findIndex(function (t) { return t.id === el.dataset.id; });
      if (i < 0) return;
      var t = l.tasks.splice(i, 1)[0]; save(); render();
      toast('DELETED', function () { l.tasks.splice(i, 0, t); });
    },
    restore: function (el) {
      var l = list(), i = l.done.findIndex(function (t) { return t.id === el.dataset.id; });
      if (i < 0) return;
      var t = l.done.splice(i, 1)[0];
      save();
      startInsert(l, t, null, 'all');
    },
    clearDone: function () { var l = list(); l.done = []; save(); render(); },
    delList: function (el) {
      var l = list();
      if (!armed(el, 'SURE? TAP AGAIN')) return;
      var i = data.lists.indexOf(l);
      data.lists.splice(i, 1); save(); go('home', 'back');
      toast('LIST DELETED', function () { data.lists.splice(i, 0, l); });
    },
    sample: function () {
      sampleData();
      save(); go('home', 'back');
    },
    erase: function (el) {
      if (!armed(el, 'SURE? TAP AGAIN')) return;
      data = { lists: [], nextColor: 0 }; save(); go('home', 'back');
    }
  };

  // Destructive actions take a second tap instead of a confirm() dialog,
  // which embedded and home-screen web apps can suppress.
  function armed(el, label) {
    if (el.dataset.armed) return true;
    var span = el.querySelector('span'), was = span.textContent;
    el.dataset.armed = '1'; span.textContent = label;
    setTimeout(function () { delete el.dataset.armed; span.textContent = was; }, 3000);
    return false;
  }

  var submits = {
    createList: function (text) {
      var l = newList(text); save();
      ui.listId = l.id; go('list');
    },
    createTask: function (text) {
      startInsert(list(), { id: uid(), text: text }, null, 'list');
    }
  };

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el || el.disabled || !actions[el.dataset.a]) return;
    if (swiped) { swiped = false; return; }
    actions[el.dataset.a](el);
  });

  app.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, text = f.t.value.replace(/\s+/g, ' ').trim();
    if (!text) { f.t.focus(); return; }
    submits[f.dataset.submit](text);
  });

  // Return submits instead of adding a newline.
  app.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'TEXTAREA' && e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      e.target.form.requestSubmit();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (ui.view === 'compare') {
      if (e.key === 'ArrowUp') { e.preventDefault(); answer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); answer(false); }
      else if (e.key === 'Escape') cancelCompare();
    } else if (e.key === 'Escape' && e.target.tagName === 'TEXTAREA') {
      actions[ui.view === 'addList' ? 'home' : 'list']();
    }
  });

  // Swipe up = the new task (top) comes first, swipe down = the other one.
  var swiped = false;
  function bindSwipe() {
    var el = document.getElementById('compare'), y0 = null;
    el.addEventListener('touchstart', function (e) { y0 = e.touches[0].clientY; swiped = false; }, { passive: true });
    el.addEventListener('touchend', function (e) {
      if (y0 == null) return;
      var dy = e.changedTouches[0].clientY - y0; y0 = null;
      if (Math.abs(dy) > 50) { swiped = true; answer(dy < 0); setTimeout(function () { swiped = false; }, 400); }
    });
  }

  function sampleData() {
    newList('Around the House', ['Clean out rain gutters', 'Power wash driveway', 'Replace furnace filter', 'Fix squeaky door']);
    newList('Vegas Trip', ['Book hotel', 'Find flights', 'Get show tickets']);
    newList('Presentation', ['Outline the talk', 'Make slides', 'Rehearse twice']);
    newList('Auto Maintenance', ['Oil change', 'Rotate tires']);
    newList('Xmas Party', ['Pick a date', 'Send invites', 'Order food']);
    newList('Other Stuff', ['Call mom']);
    newList('Portfolio Rebuild', ['Pick five best projects', 'Write case studies', 'Ship it']);
  }

  render();
})();
</script>
</body>
</html>
